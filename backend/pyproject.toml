[project]
name = "discovery-engine-backend"
version = "0.1.0"
description = "AI-Powered User Discovery Engine for Google Photos Retrieval"
requires-python = ">=3.11"
dependencies = [
    # === Web Framework ===
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",

    # === Database ===
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "psycopg2-binary>=2.9.9",

    # === Task Queue ===
    "celery[redis]>=5.4.0",
    "redis>=5.0.0",

    # === Scraping ===
    "google-play-scraper>=1.2.0",
    "app-store-scraper>=0.3.5",
    "asyncpraw>=7.7.0",
    "httpx>=0.27.0",
    "beautifulsoup4>=4.12.0",
    "google-api-python-client>=2.130.0",
    "apify-client>=1.6.0",

    # === NLP & ML ===
    "spacy>=3.7.0",
    "sentence-transformers>=3.0.0",
    "transformers>=4.41.0",
    "torch>=2.3.0",
    "vaderSentiment>=3.3.2",
    "langdetect>=1.0.9",
    "datasketch>=1.6.0",

    # === Data Processing ===
    "pandas>=2.2.0",
    "pandera>=0.19.0",

    # === Vector DB ===
    "chromadb>=0.5.0",

    # === LLM ===
    "groq>=0.8.0",
    "langchain>=0.1.0",
    "langchain-community>=0.0.10",

    # === Utilities ===
    "sse-starlette>=2.1.0",
    "slowapi>=0.1.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "httpx>=0.27.0",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
