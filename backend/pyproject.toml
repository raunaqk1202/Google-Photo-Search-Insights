[project]
name = "discovery-engine-backend"
version = "0.1.0"
description = "AI-Powered User Discovery Engine for Google Photos Retrieval"
requires-python = ">=3.11"
dependencies = [
    # === Web Framework ===
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",

    # === Database ===
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "psycopg2-binary>=2.9.9",

    # === Task Queue ===
    # Celery/Redis removed as requested

    # === Scraping ===
    # Scrapers removed as requested (data already in DB)
    "httpx>=0.27.0",

    # === NLP & ML ===
    "datasketch>=1.6.0",

    # === Data Processing ===
    "pandas>=2.2.0",
    "pandera>=0.19.0",

    # === Vector DB & Embeddings ===
    "chromadb>=0.5.0",
    "onnxruntime>=1.14.0",
    "tokenizers>=0.13.0",

    # === LLM ===
    "groq>=0.8.0",
    "langchain>=0.1.0",
    "langchain-community>=0.0.10",

    # === Utilities ===
    "sse-starlette>=2.1.0",
    "slowapi>=0.1.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "httpx>=0.27.0",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
