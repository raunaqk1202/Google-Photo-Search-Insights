version: "3.9"

services:
  # ========================
  # Data Layer
  # ========================
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-discovery}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-discovery_secret}
      POSTGRES_DB: ${POSTGRES_DB:-discovery_engine}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U discovery"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis removed

  chromadb:
    image: chromadb/chroma:latest
    ports:
      - "8000:8000"
    volumes:
      - chroma_data:/chroma/chroma
    environment:
      ANONYMIZED_TELEMETRY: "false"

  # ========================
  # Application Layer
  # ========================
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    ports:
      - "8080:8000"
    env_file:
      - ../.env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://discovery:discovery_secret@postgres:5432/discovery_engine}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      CHROMA_HOST: ${CHROMA_HOST:-chromadb}
      CHROMA_PORT: ${CHROMA_PORT:-8000}
    depends_on:
      postgres:
        condition: service_healthy
      chromadb:
        condition: service_started
    volumes:
      - ../backend:/app
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000 --reload

  # Celery removed

  # ========================
  # Frontend (Dev Server)
  # ========================
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    volumes:
      - ../frontend:/app
      - /app/node_modules
    environment:
      VITE_API_BASE_URL: http://localhost:8080

volumes:
  postgres_data:
  chroma_data:
